    <!-- The bouncing turtle gif -->
    <img src="8d9e7a1139cb1be89ccf808dfc1e21ba.gif" alt="Bouncing Turtle" id="bouncing-logo">

    <!-- The JavaScript for the DVD-style bounce -->
    <script>
        const logo = document.getElementById('bouncing-logo');
        let x = 50;
        let y = 50;
        let dx = 3; // Horizontal speed 
        let dy = 3; // Vertical speed

        function animate() {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            const logoWidth = logo.offsetWidth || 150;
            const logoHeight = logo.offsetHeight || 150;

            x += dx;
            y += dy;

            // Reverse direction if it hits the side walls
            if (x + logoWidth >= screenWidth || x <= 0) {
                dx = -dx;
            }

            // Reverse direction if it hits the top or bottom walls
            if (y + logoHeight >= screenHeight || y <= 0) {
                dy = -dy;
            }

            logo.style.left = x + 'px';
            logo.style.top = y + 'px';

            requestAnimationFrame(animate);
        }

        // Start animation when image loads
        logo.onload = () => { animate(); };
        if (logo.complete) { animate(); }
    </script>
</body>
