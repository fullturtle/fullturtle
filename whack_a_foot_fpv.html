<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-A-Foot 3D FPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- PointerLockControls for FPS View -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <!-- TWEEN for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <!-- Tone.js for NES Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #f4ecd8; font-family: 'Comic Sans MS', cursive, sans-serif; user-select: none; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        
        .crayola-text {
            color: #222;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            font-weight: bold;
            letter-spacing: 2px;
        }

        #score-board { display: flex; justify-content: space-between; font-size: 2rem; width: 100%; }
        .stat-box { background: rgba(255, 255, 255, 0.7); border: 3px solid #222; border-radius: 15px; padding: 10px 20px; box-shadow: 4px 4px 0px #222; }

        /* Red overlay for scary effect */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(200,0,0,0.5) 100%);
            pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 5;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 0, 0, 0.8);
            font-size: 30px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
        }

        #start-screen, #game-over-screen, #pause-screen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 5px dashed #e83a3a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
            z-index: 20;
        }

        button {
            background-color: #4CAF50;
            border: 4px solid #2e7d32;
            color: white;
            padding: 15px 32px;
            font-size: 24px;
            margin: 20px 2px;
            cursor: pointer;
            border-radius: 12px;
            font-family: inherit;
            box-shadow: 4px 4px 0px #2e7d32;
            transition: all 0.1s;
        }
        button:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #2e7d32; }

        #level-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: #e83a3a;
            opacity: 0;
            transition: opacity 0.5s;
            text-shadow: 4px 4px 0px #222, -2px -2px 0 #fff;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer">
        <div id="score-board">
            <div class="stat-box crayola-text">Level: <span id="level-display">1</span></div>
            <div class="stat-box crayola-text">Score: <span id="score-display">0</span></div>
            <div class="stat-box crayola-text" style="color: #c00;">Misses: <span id="miss-display">0</span>/6</div>
            <div class="stat-box crayola-text">Time: <span id="time-display">60</span>s</div>
        </div>
        <div id="crosshair">+</div>
        <div id="damage-overlay"></div>
        <div id="level-indicator" class="crayola-text">LEVEL UP!</div>
    </div>

    <div id="start-screen">
        <h1 class="text-6xl mb-4 crayola-text" style="color: #e83a3a;">Whack-A-Foot! FPS</h1>
        <p class="text-xl mb-2 crayola-text">Use <b>W A S D</b> to walk around.</p>
        <p class="text-xl mb-6 crayola-text">Use your <b>Mouse</b> to look, click to <b>SMASH</b>!<br>Hold <b>E</b> to SPRINT!</p>
        <button id="start-btn">CLICK TO START</button>
    </div>

    <div id="pause-screen" style="display: none;">
        <h1 class="text-5xl mb-4 crayola-text">PAUSED</h1>
        <p class="text-xl mb-6 crayola-text">Click anywhere to resume.</p>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1 class="text-5xl mb-4 crayola-text" id="game-over-title">Game Over!</h1>
        <p class="text-2xl mb-2 crayola-text">Final Score: <span id="final-score">0</span></p>
        <p class="text-xl mb-6 crayola-text">You reached Level <span id="final-level">1</span></p>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>
</div>

<script>
    let score = 0, level = 1, timeLeft = 60;
    let missCount = 0;
    const MAX_MISSES = 6;
    let gameActive = false;
    let isPaused = false;
    let appleObjects = []; 
    let collidableFeet = []; // For raycasting
    let gameTimer, moleTimer;

    // Circling Feet Mechanic Variables
    const circlingGroup = new THREE.Group();
    let targetRadius = 15;
    let currentRadius = 15;

    // NES Sound Effects (Tone.js)
    let sfxLoaded = false;
    const synths = {};

    function initAudio() {
        if (sfxLoaded) return;
        // Square wave for classic 8-bit hits/melodies
        synths.hit = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
        synths.hit.volume.value = -5;

        // Noise for swings
        synths.swing = new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0 } }).toDestination();
        synths.swing.volume.value = -15;

        // Quiet brown noise for footsteps
        synths.step = new Tone.NoiseSynth({ noise: { type: 'brown' }, envelope: { attack: 0.01, decay: 0.05, sustain: 0 } }).toDestination();
        synths.step.volume.value = -25;

        // PolySynth for level up fanfare
        synths.levelUp = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'square' } }).toDestination();
        synths.levelUp.volume.value = -10;

        // Deep thud for a miss
        synths.miss = new Tone.MembraneSynth().toDestination();
        synths.miss.volume.value = 5;

        sfxLoaded = true;
    }

    function playSound(type) {
        if (!sfxLoaded || !gameActive) return;
        if (type === 'swing') synths.swing.triggerAttackRelease("16n");
        if (type === 'hit') synths.hit.triggerAttackRelease("C5", "8n");
        if (type === 'step') synths.step.triggerAttackRelease("32n");
        if (type === 'levelup') {
            const now = Tone.now();
            synths.levelUp.triggerAttackRelease("C4", "16n", now);
            synths.levelUp.triggerAttackRelease("E4", "16n", now + 0.1);
            synths.levelUp.triggerAttackRelease("G4", "16n", now + 0.2);
            synths.levelUp.triggerAttackRelease("C5", "8n", now + 0.3);
        }
        if (type === 'miss') {
            synths.miss.triggerAttackRelease("C1", "4n");
        }
        if (type === 'gameover') {
            const now = Tone.now();
            synths.hit.triggerAttackRelease("G3", "8n", now);
            synths.hit.triggerAttackRelease("Eb3", "8n", now + 0.3);
            synths.hit.triggerAttackRelease("C3", "4n", now + 0.6);
        }
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05100c); // Dark night sky
    scene.fog = new THREE.FogExp2(0x05100c, 0.04); // Atmospheric fog
    
    // FPV Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 3; // Eye level

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // Atmospheric Lighting
    scene.add(new THREE.AmbientLight(0x2a3b32, 0.4)); // Dark greenish ambient
    const dirLight = new THREE.DirectionalLight(0x88bbff, 0.6); // Moonlight
    dirLight.position.set(10, 20, -10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
    dirLight.shadow.camera.left = -40; dirLight.shadow.camera.right = 40; dirLight.shadow.camera.top = 40; dirLight.shadow.camera.bottom = -40;
    scene.add(dirLight);

    // Magical point light for the arena center
    const arenaLight = new THREE.PointLight(0xffddaa, 0.5, 40);
    arenaLight.position.set(0, 10, 0);
    scene.add(arenaLight);

    scene.add(circlingGroup);

    const matAppleRed = new THREE.MeshPhongMaterial({ color: 0xcc2929, shininess: 10, flatShading: true });
    const matLeafGreen = new THREE.MeshPhongMaterial({ color: 0x4caf50, shininess: 5, flatShading: true });
    const matStemBrown = new THREE.MeshPhongMaterial({ color: 0x5d4037, shininess: 5 });
    const matLabelWhite = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 10 });
    const matLabelText = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const matSkin = new THREE.MeshPhongMaterial({ color: 0xf5d0c5, shininess: 10 });
    const matNail = new THREE.MeshPhongMaterial({ color: 0x333333, shininess: 50 });

    // Forest Floor Ground
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x111c13, roughness: 0.9, metalness: 0.1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Generate Giant Forest
    const matTrunk = new THREE.MeshStandardMaterial({ color: 0x2b1c10, roughness: 1.0 });
    const matLeaves = new THREE.MeshStandardMaterial({ color: 0x091c0c, flatShading: true, roughness: 0.8 });
    
    for(let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = 25 + Math.random() * 60; // Outside the arena
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;
        
        const tree = new THREE.Group();
        const trunkHeight = 10 + Math.random() * 10;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.2, trunkHeight, 7), matTrunk);
        trunk.position.y = trunkHeight / 2;
        trunk.castShadow = true; trunk.receiveShadow = true;
        tree.add(trunk);
        
        const leafLevels = 3 + Math.floor(Math.random() * 2);
        for(let j = 0; j < leafLevels; j++) {
            const size = 6 - j * 1.2;
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(size, size * 1.5, 7), matLeaves);
            leaves.position.y = trunkHeight - 2 + (j * size);
            leaves.castShadow = true; leaves.receiveShadow = true;
            tree.add(leaves);
        }
        
        tree.position.set(x, 0, z);
        tree.rotation.y = Math.random() * Math.PI;
        const scale = 0.8 + Math.random() * 0.7;
        tree.scale.set(scale, scale, scale);
        scene.add(tree);
    }
    
    // First-Person Weapon (Classic Whack-a-Mole Mallet Attached to camera)
    const hammerGroup = new THREE.Group();
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 3.5, 16), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
    handle.position.y = -1.2;
    hammerGroup.add(handle);
    
    // Soft mallet head
    const headGroup = new THREE.Group();
    const mainHead = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 1.6, 32), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    mainHead.rotation.z = Math.PI / 2;
    mainHead.castShadow = true;
    
    // Red padded ends
    const capGeo = new THREE.CylinderGeometry(0.55, 0.6, 0.2, 32);
    const cap1 = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({ color: 0xee2222 }));
    cap1.rotation.z = Math.PI / 2; cap1.position.x = 0.9;
    const cap2 = new THREE.Mesh(capGeo, new THREE.MeshStandardMaterial({ color: 0xee2222 }));
    cap2.rotation.z = Math.PI / 2; cap2.position.x = -0.9;
    
    headGroup.add(mainHead, cap1, cap2);
    headGroup.position.y = 0.5;
    hammerGroup.add(headGroup);
    
    // Position hammer relative to camera (bottom right)
    hammerGroup.position.set(1.2, -1, -1.8);
    hammerGroup.rotation.set(-Math.PI / 8, -Math.PI / 10, -Math.PI / 12);
    camera.add(hammerGroup);
    scene.add(camera);

    function createApple() {
        const appleGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), matAppleRed);
        body.scale.set(1, 0.9, 1); body.position.y = 1.4; body.castShadow = true; body.receiveShadow = true;
        appleGroup.add(body);
        const hole = new THREE.Mesh(new THREE.CircleGeometry(0.7, 16), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        hole.rotation.x = -Math.PI / 2; hole.position.set(0, 2.7, 0); appleGroup.add(hole);
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8), matStemBrown);
        stem.position.set(-0.3, 3.0, -0.3); stem.rotation.set(0.2, 0, -0.2); appleGroup.add(stem);
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 3), matLeafGreen);
        leaf.position.set(-0.7, 3.2, -0.5); leaf.rotation.set(0.5, 0, Math.PI / 4); appleGroup.add(leaf);
        const label = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, 1.2, 32, 1, true, -Math.PI/2, Math.PI), matLabelWhite);
        label.position.y = 1.4; appleGroup.add(label);
        return appleGroup;
    }

    function createGnarlyNail(length) {
        const nailGroup = new THREE.Group();
        // Create a curved nail using 3 intersecting cones
        const n1 = new THREE.Mesh(new THREE.ConeGeometry(0.06, length * 0.4, 8), matNail);
        n1.position.z = length * 0.2; n1.rotation.x = Math.PI / 2;
        const n2 = new THREE.Mesh(new THREE.ConeGeometry(0.04, length * 0.4, 8), matNail);
        n2.position.set(0, -0.05, length * 0.5); n2.rotation.x = Math.PI / 2 - 0.2;
        const n3 = new THREE.Mesh(new THREE.ConeGeometry(0.02, length * 0.4, 8), matNail);
        n3.position.set(0, -0.15, length * 0.8); n3.rotation.x = Math.PI / 2 - 0.5;
        nailGroup.add(n1, n2, n3);
        return nailGroup;
    }

    function createFoot() {
        const footGroup = new THREE.Group();
        
        // Ankle/Leg base
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.2, 16), matSkin);
        leg.position.set(0, 0.4, -0.5); leg.rotation.x = Math.PI / 8;
        leg.castShadow = true; footGroup.add(leg);

        // Arch / Sole
        const sole = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), matSkin);
        sole.scale.set(1.05, 0.7, 1.8); sole.position.set(0, 0, 0.2); sole.castShadow = true; footGroup.add(sole);
        
        // Heel
        const heel = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), matSkin); 
        heel.scale.set(1.0, 1.1, 1.2); heel.position.set(0, 0.1, -0.6); heel.castShadow = true; footGroup.add(heel);

        // Warts / Bumps for detail
        const wartMat = new THREE.MeshPhongMaterial({color: 0x8c796b, shininess: 0});
        for(let i=0; i<3; i++) {
            const wart = new THREE.Mesh(new THREE.SphereGeometry(0.08 + Math.random()*0.05, 8, 8), wartMat);
            wart.position.set((Math.random()-0.5)*1, 0.4, (Math.random()-0.5)*1.5);
            footGroup.add(wart);
        }
        
        // Detailed Toes
        const toePositions = [{x: 0.5, z: 1.0, s: 0.28, l: 1.5}, {x: 0.2, z: 1.1, s: 0.24, l: 1.2}, {x: -0.1, z: 1.05, s: 0.20, l: 1.0}, {x: -0.35, z: 0.95, s: 0.18, l: 0.8}, {x: -0.55, z: 0.7, s: 0.15, l: 0.6}];
        toePositions.forEach(tp => {
            // Main toe body
            const toe = new THREE.Mesh(new THREE.SphereGeometry(tp.s, 12, 12), matSkin); 
            toe.scale.set(1, 0.9, 1.3);
            toe.position.set(tp.x, -0.1, tp.z); 
            
            // Knuckle joint
            const knuckle = new THREE.Mesh(new THREE.SphereGeometry(tp.s * 0.8, 12, 12), matSkin);
            knuckle.position.set(tp.x, 0.05, tp.z - tp.s);

            // Gnarly curved nail
            const nail = createGnarlyNail(tp.l);
            nail.position.set(tp.x, -0.1, tp.z + tp.s * 0.5);
            nail.rotation.set((Math.random()-0.5)*0.1, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
            
            footGroup.add(toe, knuckle, nail);
        });
        footGroup.rotation.set(-Math.PI / 4, Math.PI / 8, 0);
        return footGroup;
    }

    const controls = new THREE.PointerLockControls(camera, document.body);
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();
    let lastStepTime = 0;

    controls.addEventListener('lock', () => { 
        isPaused = false; 
        document.getElementById('pause-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'none';
    });
    controls.addEventListener('unlock', () => { 
        if(gameActive) {
            isPaused = true; 
            document.getElementById('pause-screen').style.display = 'block';
        }
    });

    document.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'ArrowUp': case 'KeyW': moveForward = true; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
            case 'ArrowDown': case 'KeyS': moveBackward = true; break;
            case 'ArrowRight': case 'KeyD': moveRight = true; break;
            case 'KeyE': isRunning = true; break;
        }
    });
    document.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'ArrowUp': case 'KeyW': moveForward = false; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
            case 'ArrowDown': case 'KeyS': moveBackward = false; break;
            case 'ArrowRight': case 'KeyD': moveRight = false; break;
            case 'KeyE': isRunning = false; break;
        }
    });

    // Spread apples out for the FPS Arena
    const arenaSpawns = [
        {x: 0, z: -5}, {x: -6, z: -4}, {x: 6, z: -4}, 
        {x: -10, z: -10}, {x: 10, z: -10}, {x: 0, z: -15},
        {x: -15, z: -5}, {x: 15, z: -5}, {x: -8, z: 5}, {x: 8, z: 5}
    ];

    function initLevel() {
        appleObjects.forEach(obj => {
            obj.active = false;
            obj.isAnimating = false; // Bug fix flag
            scene.remove(obj.group);
            if(obj.timer) clearTimeout(obj.timer);
            if(obj.hideTween) obj.hideTween.stop();
            if(obj.showTween) obj.showTween.stop();
        });
        appleObjects = [];
        collidableFeet = [];

        const numApples = Math.min(level + 2, arenaSpawns.length); // Start with 3 apples
        
        for (let i = 0; i < numApples; i++) {
            const pos = arenaSpawns[i];
            const container = new THREE.Group();
            container.position.set(pos.x, 0, pos.z);
            
            // Randomize apple rotation slightly
            container.rotation.y = Math.random() * Math.PI * 2;
            
            container.add(createApple());
            const foot = createFoot();
            foot.position.set(0, 1.5, 0); foot.scale.set(0.1, 0.1, 0.1); foot.visible = false;
            
            // Invisible hitbox for easier raycasting
            // Made hitbox taller and lowered its local center so it covers the entire foot
            // allowing the camera's raycaster to hit it reliably even if looking slightly down.
            const hitBox = new THREE.Mesh(new THREE.BoxGeometry(2, 5, 2), new THREE.MeshBasicMaterial({visible: false}));
            hitBox.position.y = 1.5;
            foot.add(hitBox);
            
            container.add(foot);
            scene.add(container);

            appleObjects.push({ group: container, foot: foot, hitBox: hitBox, active: false, isAnimating: false, hit: false, timer: null });
            collidableFeet.push(hitBox);
        }
    }

    function popFoot() {
        if (!gameActive || isPaused) {
            moleTimer = setTimeout(popFoot, 1000);
            return;
        }
        
        // Filter out active or animating objects
        const inactiveIndices = appleObjects.map((obj, i) => (!obj.active && !obj.isAnimating) ? i : -1).filter(i => i !== -1);
        if (inactiveIndices.length > 0) {
            const target = appleObjects[inactiveIndices[Math.floor(Math.random() * inactiveIndices.length)]];
            target.active = true; 
            target.isAnimating = true; 
            target.hit = false; 
            target.foot.visible = true;
            target.foot.position.set(0, 1.5, 0); target.foot.scale.set(0.1, 0.1, 0.1);
            
            const popSpeed = Math.max(300, 1000 - (level * 50));
            const stayTime = Math.max(800, 2500 - (level * 150));

            target.showTween = new TWEEN.Tween(target.foot.position).to({ y: 3.5, z: 1.0 }, popSpeed).easing(TWEEN.Easing.Back.Out)
                .onComplete(() => { target.isAnimating = false; })
                .start();
            new TWEEN.Tween(target.foot.scale).to({ x: 1, y: 1, z: 1 }, popSpeed).easing(TWEEN.Easing.Quadratic.Out).start();

            target.timer = setTimeout(() => hideFoot(target, false), popSpeed + stayTime);
        }
        moleTimer = setTimeout(popFoot, Math.max(300, 1500 - (level * 100)) + Math.random() * 500);
    }

    function registerMiss() {
        missCount++;
        document.getElementById('miss-display').textContent = missCount;
        playSound('miss');

        // Screen flash red
        const overlay = document.getElementById('damage-overlay');
        overlay.style.opacity = 0.8;
        setTimeout(() => { 
            // Only fade to partial opacity if the game is still going
            if (gameActive) overlay.style.opacity = (missCount / MAX_MISSES) * 0.5; 
        }, 200);

        // Add a scary circling foot
        const cFoot = createFoot();
        cFoot.scale.set(0.25, 0.25, 0.25); // Bigger than regular mole feet
        cFoot.position.y = 2; // Float above ground
        circlingGroup.add(cFoot);

        // Shrink the ring radius
        targetRadius = 15 - (missCount * (12 / MAX_MISSES)); 

        if (missCount >= MAX_MISSES) {
            endGame("feet");
        }
    }

    function hideFoot(target, wasHit) {
        if (!target.active) return;
        target.active = false; 
        target.isAnimating = true; // Block other animations while hiding
        clearTimeout(target.timer);
        
        // If it wasn't hit, and the game is active, and it wasn't a game reset (wasHit !== null)
        if (wasHit === false && gameActive) {
            registerMiss();
        }

        if (target.showTween) target.showTween.stop();
        const hideSpeed = (wasHit === true) ? 100 : 300;
        
        target.hideTween = new TWEEN.Tween(target.foot.position).to({ y: 1.5, z: 0 }, hideSpeed).easing(TWEEN.Easing.Quadratic.In)
            .onComplete(() => { 
                target.foot.visible = false; 
                target.isAnimating = false; // Release lock
            }).start();
            
        // If hit, we already started a squish scale tween, don't overwrite it here
        if (wasHit !== true) {
            new TWEEN.Tween(target.foot.scale).to({ x: 0.1, y: 0.1, z: 0.1 }, hideSpeed).easing(TWEEN.Easing.Quadratic.In).start();
        }
    }

    const raycaster = new THREE.Raycaster();
    let isSwinging = false;

    window.addEventListener('mousedown', (e) => {
        if (gameActive && !isPaused && !isSwinging && e.button === 0) {
            swingWeapon();
        } else if (gameActive && isPaused) {
            controls.lock(); // Resume
        }
    });
    
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && gameActive && !isPaused && !isSwinging) swingWeapon();
    });

    function swingWeapon() {
        isSwinging = true;
        playSound('swing');

        // Swing Animation (Rotate down and inward)
        const startRot = hammerGroup.rotation.clone();
        new TWEEN.Tween(hammerGroup.rotation)
            .to({ x: startRot.x - 1.2, z: startRot.z + 0.5 }, 120)
            .easing(TWEEN.Easing.Quadratic.In)
            .onComplete(() => {
                checkHit();
                // Return animation
                new TWEEN.Tween(hammerGroup.rotation).to({ x: startRot.x, z: startRot.z }, 200).easing(TWEEN.Easing.Quadratic.Out).onComplete(() => isSwinging = false).start();
            }).start();
            
        // Slight forward punch
        const startZ = hammerGroup.position.z;
        new TWEEN.Tween(hammerGroup.position).to({z: startZ - 0.5}, 100).yoyo(true).repeat(1).start();
    }

    function checkHit() {
        // Raycast from center of screen (crosshair) straight forward
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(collidableFeet);

        if (intersects.length > 0) {
            // Check distance (must be close enough to hit)
            if (intersects[0].distance < 6) {
                const hitBox = intersects[0].object;
                const target = appleObjects.find(obj => obj.hitBox === hitBox);
                
                if (target && target.active && !target.hit) {
                    target.hit = true;
                    score += 10;
                    document.getElementById('score-display').textContent = score;
                    playSound('hit');
                    
                    // Shake Camera
                    const s = camera.position.y;
                    new TWEEN.Tween(camera.position).to({y: s - 0.2}, 50).yoyo(true).repeat(1).start();

                    // Squish foot
                    // Stop current hide scale tween if any exists before starting squish
                    if(target.hideTween) target.hideTween.stop(); 
                    new TWEEN.Tween(target.foot.scale).to({ x: 1.5, y: 0.2, z: 1.5 }, 50).onComplete(() => hideFoot(target, true)).start();
                    
                    if (score > 0 && score % 50 === 0) levelUp();
                }
            }
        }
    }

    function levelUp() {
        level++;
        document.getElementById('level-display').textContent = level;
        playSound('levelup');
        
        const ind = document.getElementById('level-indicator');
        ind.style.opacity = 1; ind.style.transform = "translate(-50%, -50%) scale(1.5)";
        setTimeout(() => { ind.style.opacity = 0; ind.style.transform = "translate(-50%, -50%) scale(1)"; }, 1500);
        
        // Add time bonus
        timeLeft += 10;
        document.getElementById('time-display').textContent = timeLeft;

        initLevel();
    }

    async function startGame() {
        initAudio();
        // Wait for Tone to start properly within a user interaction context
        await Tone.start();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('damage-overlay').style.opacity = 0;
        
        // Reset Title Colors just in case
        document.getElementById('game-over-title').style.color = "#222";

        controls.lock();
        
        score = 0; level = 1; timeLeft = 60; missCount = 0;
        velocity.set(0, 0, 0); // Reset movement velocity so you don't slide on respawn
        
        // Clear circling feet
        while(circlingGroup.children.length > 0){ 
            circlingGroup.remove(circlingGroup.children[0]); 
        }
        targetRadius = 15; currentRadius = 15;
        
        document.getElementById('score-display').textContent = score;
        document.getElementById('miss-display').textContent = missCount;
        document.getElementById('level-display').textContent = level;
        document.getElementById('time-display').textContent = timeLeft;
        
        camera.position.set(0, 3, 10);
        
        initLevel();
        gameActive = true;
        isPaused = false;
        
        popFoot();
        if(gameTimer) clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            if(gameActive && !isPaused) {
                timeLeft--;
                document.getElementById('time-display').textContent = timeLeft;
                if (timeLeft <= 0) endGame("time");
            }
        }, 1000);
    }

    function endGame(reason) {
        gameActive = false;
        
        // Safely exit pointer lock
        if (document.pointerLockElement) {
            document.exitPointerLock();
        }

        clearInterval(gameTimer); clearTimeout(moleTimer);
        appleObjects.forEach(obj => { if(obj.active) hideFoot(obj, null); });
        
        playSound('gameover');
        
        const title = document.getElementById('game-over-title');
        if(reason === "feet") {
            title.textContent = "The Feet Got You!";
            title.style.color = "#c00";
        } else {
            title.textContent = "Time's Up!";
            title.style.color = "#222";
        }

        document.getElementById('final-score').textContent = score;
        document.getElementById('final-level').textContent = level;
        document.getElementById('game-over-screen').style.display = 'block';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now();
        // Cap delta time to prevent physics explosions when tabbing away and back
        const delta = Math.min((time - prevTime) / 1000, 0.1);
        TWEEN.update(time);

        if (controls.isLocked === true && gameActive) {
            // Apply friction
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            // Movement acceleration (Sprint when holding E)
            const speed = isRunning ? 80.0 : 40.0;
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);

            // Footstep sounds (rudimentary throttle based on velocity magnitude)
            const speedMag = Math.sqrt(velocity.x**2 + velocity.z**2);
            const stepThreshold = isRunning ? 150 : 300;
            if (speedMag > 1.5 && time - lastStepTime > stepThreshold) {
                playSound('step');
                lastStepTime = time;
                // Add slight head bob, faster if running
                const bobFreq = isRunning ? 0.025 : 0.015;
                camera.position.y = 3 + Math.sin(time * bobFreq) * 0.15;
            } else if (speedMag <= 1.5) {
                camera.position.y = 3; // Reset height
            }

            // Boundary constraints (Keep player in arena)
            if (camera.position.x < -20) camera.position.x = -20;
            if (camera.position.x > 20) camera.position.x = 20;
            if (camera.position.z < -20) camera.position.z = -20;
            if (camera.position.z > 20) camera.position.z = 20;
        }

        // Animate circling scary feet
        if (gameActive && circlingGroup.children.length > 0) {
            circlingGroup.position.set(camera.position.x, 0, camera.position.z);
            circlingGroup.rotation.y += 0.5 * delta; // spin ring slowly
            
            // Lerp radius
            currentRadius += (targetRadius - currentRadius) * 2.0 * delta;

            const numFeet = circlingGroup.children.length;
            circlingGroup.children.forEach((foot, i) => {
                const angle = (i / numFeet) * Math.PI * 2;
                // Pulse up and down slightly
                const floatY = 2.5 + Math.sin(time * 0.003 + i) * 0.5;
                foot.position.set(Math.cos(angle) * currentRadius, floatY, Math.sin(angle) * currentRadius);
                // Point inwards at player
                foot.rotation.y = -angle - Math.PI / 2;
                // Wiggle toes/foot slightly
                foot.rotation.x = Math.sin(time * 0.01 + i) * 0.1 - Math.PI / 6;
            });
        }

        prevTime = time;
        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
